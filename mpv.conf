osc = no

# ========== 跳过片头片尾设置 ==========
# --start=+120 # 从开始后120秒播放 || --end=-40 # 到结尾前40秒时退出
# start = +120
# --end = -100

border = no
osd-level = 1 # osd显示等级（osd-status-msg），1仅状态改变显示、3全部显示
# 显示百分比：${time-pos}/${duration}${?percent-pos:(${percent-pos}%)}'
osd-status-msg = ${time-pos}/${duration}\n🕒 ${clock}  # 显示播放时间和系统时间
osd-font-size = 10
osd-align-x = right
osd-bar = no
osd-border-size = 1
# sub-ass-override = strip # 控制字幕是否应该应用用户风格覆盖。
osd-outline-size = 0
osd-bold = yes
sub-color = '#dadee3'
sub-font-size = 36
blend-subtitles=yes
volume-max = 100
load-context-menu=yes
# ========== 色彩优化（可自行需求开启） ==========
contrast=5
saturation=3
# brightness=0
# 开启去隔行扫描-去除摩尔纹
# deinterlace=yes
# ========== 自动加载 ==========
sub-auto=fuzzy
audio-file-auto=fuzzy

# ========== 提速必关 ==========
icc-profile-auto=no
# ========== 降低同步/脚本消耗 ==========
# 禁用统计信息/调试输出
terminal=no
msg-level=all=error
# ===========
save-position-on-quit = yes
# video-sync=display-resample # 让弹幕更流畅，会增加cpu压力，默认关闭，要开启请删除最前面的 # 号
autofit=50%

watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# ========= 自动加载文件夹内所有视频 ==========
autocreate-playlist=same
directory-mode=ignore




# === HDR 核心 注：新增配置字段的话请务必在此上方添加，否则配置可能无效====
# ====================================================================
# 1. 跨平台通用基础渲染设置（所有系统共用）
# ====================================================================
target-colorspace-hint=yes              # 核心！自动检测系统 HDR 状态，开启则真 HDR 输出，关闭则完美转 SDR
tone-mapping=spline                     # 顶级的样条线色调映射算法，在 SDR 屏幕上完美转换 HDR
hwdec=auto                              # 硬件解码自动，根据系统和视频自动选择最佳解码方式

# ============================================================
# 平台特定优化（覆盖 vo 和 hwdec）
# ============================================================
# Windows
[win]
profile-cond=platform == "win32"
profile-restore=copy
vo=gpu-next
gpu-api=auto

# Linux
[linux]
profile-cond=platform == "linux"
profile-restore=copy
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe                         # Linux 下硬件解码自动选择，避免部分机型解码崩溃

# macOS Apple Silicon
[macos-arm]
profile-cond=platform == "darwin" and os.exec("uname -m") == "arm64"
profile-restore=copy
vo=gpu-next
gpu-api=vulkan