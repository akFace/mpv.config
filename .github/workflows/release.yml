name: Auto Build and Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - "preview/**"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version and Release Notes
        id: release_info
        shell: bash
        run: |
          set -e

          # 获取最新 Tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi

          echo "Last Tag: $LAST_TAG"

          # 自动递增版本号
          VERSION_NUM=${LAST_TAG#v}
          MAJOR_MINOR=${VERSION_NUM%.*}
          PATCH=${VERSION_NUM##*.}

          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR_MINOR}.${NEW_PATCH}"

          echo "New Tag: $NEW_TAG"

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # 获取 Commit 日志
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s")
          else
            COMMITS=$(git log --pretty=format:"- %s")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- 自动更新配置与脚本"
          fi

          # 生成 Release 描述
          cat > release_body.txt <<EOF
          ### 两套主题皮肤：\`modernz\` 和 \`uosc\` 多种菜单风格

          - 请选择喜欢的某一套下载即可
          - 已包含所有配置文件，解压放到配置文件夹下即可
          - \`modernz_xxx.zip\`和\`uosc_xxx.zip\` 后缀为不同风格的右键菜单，功能一样。 👉 [右键菜单预览](https://github.com/akFace/mpv.config#%E5%8A%9F%E8%83%BD%E5%BC%BA%E5%A4%A7%E7%9A%84%E5%8F%B3%E9%94%AE%E8%8F%9C%E5%8D%95)
          - 👉 [使用教程](https://github.com/akFace/mpv.config#%E4%BD%BF%E7%94%A8%E6%96%B9%E6%B3%95)
          - 关于弹幕流畅度问题，目前本人的设备屏幕是 4k60hz，要打开video-sync=display-resample才流畅，但有些用户的设备打开此设置开倍速播放会导致声音卡问题，因此现在默认关闭，需要设置的请打开 mpv.conf 文件编辑，删除此行代码最前面的 # 号

          ---

          ## Update log:

          EOF

          echo "$COMMITS" >> release_body.txt

      - name: Create ZIP Archives
        run: |
          # 检查皮肤目录是否存在
          for skin in modernz uosc; do
            if [ ! -d "$skin" ]; then
              echo "Error: $skin directory not found!"
              exit 1
            fi
          done

          # 定义菜单配置 (suffix:config_file)
          menu_configs=("default:menu-default.conf" "macos-white:menu-macos-white.conf" "macos-dark:menu-macos-dark.conf")
          for entry in "${menu_configs[@]}"; do
            suffix="${entry%:*}"
            conf_file="${entry#*:}"
            if [ ! -f "$conf_file" ]; then
              echo "Warning: $conf_file not found, skipping this menu config"
              continue
            fi
            for skin in modernz uosc; do
              temp_dir="${skin}_${suffix}"
              echo "Creating $temp_dir"
              # 复制整个皮肤目录（包含所有子文件夹）
              cp -r "$skin" "$temp_dir"
              # 确保 script-opts 目录存在
              mkdir -p "$temp_dir/script-opts"
              # 复制菜单配置并覆盖（-f 强制覆盖）
              cp -f "$conf_file" "$temp_dir/script-opts/menu.conf"
              # 复制全局配置并覆盖（-f 强制覆盖）
              cp -f mpv.conf input.conf "$temp_dir/"

              # 写入当前打包版本号
              # 版本号与本次 GitHub Release 的 Tag 保持一致，例如：v1.2.3
              printf '%s\n' "${{ steps.release_info.outputs.NEW_TAG }}" > "$temp_dir/config-version"

              # 打包
              zip -r "${temp_dir}.zip" "$temp_dir"
              # 清理临时目录
              rm -rf "$temp_dir"
            done
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.NEW_TAG }}
          name: ${{ steps.release_info.outputs.NEW_TAG }}
          body_path: release_body.txt
          files: |
            *.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
