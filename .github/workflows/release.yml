name: Auto Build and Release

on:
  push:
    branches:
      - master
    paths:
      - "**" # 所有文件变更都会触发
    paths-ignore: # 但排除以下文件
      - "README.md"
      - "preview/**" # 排除 preview 目录
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version and Release Notes
        id: release_info
        shell: bash
        run: |
          set -e

          # 获取最新 Tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi

          echo "Last Tag: $LAST_TAG"


          # 自动递增版本号
          VERSION_NUM=${LAST_TAG#v}
          MAJOR_MINOR=${VERSION_NUM%.*}
          PATCH=${VERSION_NUM##*.}

          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR_MINOR}.${NEW_PATCH}"

          echo "New Tag: $NEW_TAG"

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"


          # 获取 Commit 日志
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s")
          else
            COMMITS=$(git log --pretty=format:"- %s")
          fi


          if [ -z "$COMMITS" ]; then
            COMMITS="- 自动更新配置与脚本"
          fi


          # 生成 Release 描述
          cat > release_body.txt <<EOF
          ### 两套主题皮肤：\`modernz\` 和 \`uosc\`

          - 请选择喜欢的某一套下载即可
          - 已包含所有配置文件，解压放到配置文件夹下即可
          - 👉 [使用教程](https://github.com/akFace/mpv.config#%E4%BD%BF%E7%94%A8%E6%96%B9%E6%B3%95)

          ---

          ## Update log:

          EOF

          echo "$COMMITS" >> release_body.txt

      - name: Create ZIP Archives
        run: |
          # 检查配置文件是否存在并复制到对应文件夹
          for folder in modernz uosc; do
            if [ -d "$folder" ]; then
              [ -f "mpv.conf" ] && cp mpv.conf "$folder/"
              [ -f "input.conf" ] && cp input.conf "$folder/"
              
              # 打包对应文件夹
              zip -r "$folder.zip" "$folder"
            else
              echo "Error: $folder directory not found!"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.NEW_TAG }}
          name: ${{ steps.release_info.outputs.NEW_TAG }}
          body_path: release_body.txt
          files: |
            modernz.zip
            uosc.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
