# Right-click Menu and Shortcut Key Configuration
Ctrl+o  script-message-to menu open               #menu: Open > File...
Ctrl+O  script-message-to menu open-folder        #menu: Open > Folder...
_           script-message-to dialog open append  #menu: Open > Add to Playlist...
_           ignore                                #menu: Open > -
_           script-message-to dialog open bd-iso  #menu: Open > Blu-ray ISO...
_           script-message-to dialog open dvd-iso #menu: Open > DVD ISO...
_           ignore                                #menu: Open > -
Ctrl+v  script-message-to menu open-clipboard     #menu: Open > From Clipboard
_           ignore                                #menu: Open > -
_                script-binding recentmenu/open        #menu: Open > Recent Files #@recent
Ctrl+R  script-message-to recentmenu open-recent-menu  #menu: Open > Recent Playlists
_                 script-binding recentmenu/clear      #menu: Open > Clear Recent Playlist


Space       cycle pause                           #menu: Playback > Play/Pause #@state=(idle_active and 'disabled' or (pause or 'hidden'))
Ctrl+s      stop                                  #menu: Playback > Stop #@state=(idle_active and 'disabled')
_           ignore                                #menu: Playback > -
l       ab-loop                                   #menu: Playback > Set/Clear A-B Loop
L       cycle-values loop-file inf no             #menu: Playback > Toggle Loop Playback

_           ignore                                #menu: Navigation > Chapters #@chapters
F12         playlist-next                         #menu: Navigation > Next File
F11         playlist-prev                         #menu: Navigation > Previous File
_           ignore                                #menu: Navigation > -
PGUP        add chapter  1                        #menu: Navigation > Next Chapter
PGDWN       add chapter -1                        #menu: Navigation > Previous Chapter
_           ignore                                #menu: Navigation > -
.           frame-step                            #menu: Navigation > Next Frame
,           frame-back-step                       #menu: Navigation > Previous Frame
_           ignore                                #menu: Navigation > -
Right       seek  5                               #menu: Navigation > Seek Forward 5s
Left        seek -5                               #menu: Navigation > Seek Backward 5s
_           ignore                                #menu: Navigation > -
Up          seek  30                              #menu: Navigation > Seek Forward 30s
Down        seek -30                              #menu: Navigation > Seek Backward 30s
_           ignore                                #menu: Navigation > -
Ctrl+Right  seek  300                             #menu: Navigation > Seek Forward 5 min
Ctrl+Left   seek -300                             #menu: Navigation > Seek Backward 5 min

               
_           ignore                                #menu: Tracks #@tracks
_           ignore                                #menu: Video Quality #@editions
_           ignore                                #menu: Playlist #@playlist

[           add speed -0.1                  #menu: Video > Speed > -10%
]           add speed 0.1                    #menu: Video > Speed > +10%
_           ignore                                #menu: Video > Speed > -
{           multiply speed 0.5                    #menu: Video > Speed > Half Speed
}           multiply speed 2.0                    #menu: Video > Speed > Double Speed
_           ignore                                #menu: Video > Speed > -
_           set speed 0.5                         #menu: Video > Speed > 0.5x
_           set speed 0.75                        #menu: Video > Speed > 0.75x
_           set speed 1.0                         #menu: Video > Speed > 1.0x
_           set speed 1.25                        #menu: Video > Speed > 1.25x
_           set speed 1.5                         #menu: Video > Speed > 1.5x
_           set speed 2.0                         #menu: Video > Speed > 2.0x
_           ignore                                #menu: Video > Speed > -
BS          set speed 1                           #menu: Video > Speed > Reset
KP8         cycle video                           #menu: Video > Switch Track #@tracks/video
_           set hwdec "no"                        #menu: Video > Decoder > Software
_           set hwdec "auto-safe"                 #menu: Video > Decoder > Auto-select Hardware Acceleration
_           set hwdec "auto-copy-safe"            #menu: Video > Decoder > Auto-select Copy-back Hardware Acceleration
_           set hwdec "nvdec"                     #menu: Video > Decoder > NVDEC Hardware
_           set hwdec "d3d11va"                   #menu: Video > Decoder > D3D11VA Hardware
_           set hwdec "nvdec-copy"                #menu: Video > Decoder > NVDEC Copy-back Hardware
_           set hwdec "d3d12va-copy"              #menu: Video > Decoder > D3D12VA Copy-back Hardware
_           set hwdec "d3d11va-copy"              #menu: Video > Decoder > D3D11VA Copy-back Hardware
_           set video-sync audio;show-text "Frame sync mode:${video-sync}"                   #menu: Video > Frame Sync Mode > Audio #@state=(video_sync == "audio" and 'checked')
_           set video-sync display-resample;show-text "Frame sync mode:${video-sync}"        #menu: Video > Frame Sync Mode > Display Resample #@state=(video_sync == "display-resample" and 'checked')
_           set video-sync display-tempo;show-text "Frame sync mode:${video-sync}"           #menu: Video > Frame Sync Mode > Display Tempo #@state=(video_sync == "display-tempo" and 'checked')
_           set video-sync display-vdrop;show-text "Frame sync mode:${video-sync}"           #menu: Video > Frame Sync Mode > Display Vdrop #@state=(video_sync == "display-vdrop" and 'checked')
_           set video-sync display-resample-vdrop;show-text "Frame sync mode:${video-sync}"  #menu: Video > Frame Sync Mode > Display Resample-vdrop #@state=(video_sync == "display-resample-vdrop" and 'checked')
_           cycle-values  video-sync display-resample display-tempo audio display-vdrop display-resample-vdrop;show-text "Frame sync mode:${video-sync}"  #menu: Video > Frame Sync Mode > Cycle
_           script-message-to dialog open add-video #menu: Video > Load File... #@state=(idle_active and 'disabled')
_           ignore                                #menu: Video > -
_           script-binding mpv360/toggle                #menu: Video > 360°VR > Toggle
Ctrl+MBTN_LEFT script-binding mpv360/toggle-mouse-look  #menu: Video > 360° VR > Mouse Look (Ctrl+Left Click)
Ctrl+WHEEL_UP  script-binding mpv360/fov-decrease       #menu: Video > 360°VR > FOV Decrease (Ctrl+Scroll)
Ctrl+WHEEL_DOWN   script-binding mpv360/fov-increase    #menu: Video > 360°VR > FOV Increase (Ctrl+Scroll)
Alt+g           script-binding mpv360/reset-view        #menu: Video > 360°VR > Reset View
_           script-binding mpv360/switch-eye            #menu: Video > 360°VR > Switch Eye
_          script-binding mpv360/cycle-sampling         #menu: Video > 360°VR > Sampling
_          script-binding mpv360/cycle-projection       #menu: Video > 360°VR > Projection
Alt+h           script-binding mpv360/show-help         #menu: Video > 360°VR > Help
_           ignore                                #menu: Video > -
Ctrl+1      add contrast -1                       #menu: Video > Color > Contrast -1
Ctrl+2      add contrast  1                       #menu: Video > Color > Contrast +1
_           ignore                                #menu: Video > Color > -
Ctrl+3      add brightness -1                     #menu: Video > Color > Brightness -1
Ctrl+4      add brightness  1                     #menu: Video > Color > Brightness +1
_           ignore                                #menu: Video > Color > -
Ctrl+5      add gamma -1                          #menu: Video > Color > Gamma -1
Ctrl+6      add gamma  1                          #menu: Video > Color > Gamma +1
_           ignore                                #menu: Video > Color > -
Ctrl+7      add saturation -1                     #menu: Video > Color > Saturation -1
Ctrl+8      add saturation  1                     #menu: Video > Color > Saturation +1
_           ignore                                #menu: Video > Color > -
Ctrl+9      add hue -1                            #menu: Video > Color > Hue -1
Ctrl+0      add hue  1                            #menu: Video > Color > Hue +1
_           ignore                                #menu: Video > Color > -
_           set contrast 0; set brightness 0; set gamma 0; set saturation 0; set hue 0 #menu: Video > Color > Reset
Ctrl+I      cycle icc-profile-auto                #menu: Video > Auto ICC Profile #@state=(icc_profile_auto and 'checked')
_           ignore                                #menu: Video > -
Ctrl+r      cycle-values video-rotate 90 180 270 0 #menu: Video > Rotate
Ctrl+-      add video-zoom -0.1                   #menu: Video > Zoom > Zoom Out -1%
Ctrl+=      add video-zoom  0.1                   #menu: Video > Zoom > Zoom In +%
Ctrl+KP4    add video-pan-x -0.01                 #menu: Video > Pan > Left
Ctrl+KP6    add video-pan-x  0.01                 #menu: Video > Pan > Right
_           ignore                                #menu: Video > Pan > -
Ctrl+KP8    add video-pan-y -0.01                 #menu: Video > Pan > Up
Ctrl+KP2    add video-pan-y  0.01                 #menu: Video > Pan > Down
Ctrl+BS     set video-zoom 0; set video-pan-x 0; set video-pan-y 0 #menu: Video > Pan > Reset
a cycle-values video-aspect-override 16:9 4:3 2.35:1 0 -1    #menu: Video > Aspect Ratio > Cycle
_           set video-aspect-override 16:9        #menu: Video > Aspect Ratio > 16:9
_           set video-aspect-override 4:3         #menu: Video > Aspect Ratio > 4:3
_           set video-aspect-override 2.35:1      #menu: Video > Aspect Ratio > 2.35:1
_           set video-aspect-override -1          #menu: Video > Aspect Ratio > Auto

Alt+c script-message cycle_interp/close ; no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"       #menu: Video Enhancement > Close All
