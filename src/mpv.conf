# ================= mpv.conf ==================
# =====================================================
# https://github.com/akFace/mpv.config/wiki
# =====================================================
# The include parameter is used to load additional configuration files. If needed, enable it manually and create a file named custom-opts.conf in the same directory as mpv.conf.
# It is mainly used to add or modify custom configuration parameters, avoiding having your changes overwritten when mpv.conf is updated.
# For usage details, see:  https://github.com/akFace/mpv.config/wiki
# =====================================================
# ===========================================================================
#  请注意！！！不建议直接修改此文件，建议使用 include 参数的功能进行增加/修改配置
# ===========================================================================
# include 参数用于追加读取额外的配置文件，需要的请手动开启并在 mpv.conf 同目录下创建文件并重命名为：custom-opts.conf
# 一般情况下主要是用来自定义新增或修改配置参数，避免直接修改 mpv.conf 导致更新覆盖。
# 使用方法详见： https://github.com/akFace/mpv.config/wiki 相关issue：https://github.com/akFace/mpv.config/issues/19
# =====================================================
# include = "~~/custom-opts.conf"  # 若要开启请删除此行 include 前面的 # 号 Remove the # before include to enable it.

osc = no

# ========== 跳过片头片尾设置 ==========
# --start=+120 # 从开始后120秒播放 || --end=-40 # 到结尾前40秒时退出
# start = +120
# --end = -100

border = no
# osd显示等级（osd-status-msg），1仅状态改变显示、3全部显示
osd-level = 1
# 显示百分比：${time-pos}/${duration}${?percent-pos:(${percent-pos}%)}'
osd-status-msg = ${time-pos}/${duration}\n🕒 ${clock}  # 显示播放时间和系统时间
osd-font-size = 10
osd-align-x = right
osd-bar = no
osd-border-size = 1
# 控制字幕是否应该应用用户风格覆盖。
# sub-ass-override = strip
osd-outline-size = 0
osd-bold = yes
sub-color = '#dadee3'
sub-font-size = 36
blend-subtitles=yes
# 启动默认声音大小
volume=70
# 最大声音大小
volume-max = 120
load-context-menu=yes
# ========== 色彩优化（可自行需求开启） ==========
contrast=5
saturation=3
# brightness=0
# 开启去隔行扫描-去除摩尔纹
# deinterlace=yes
# ========== 自动加载 ==========
sub-auto=fuzzy
audio-file-auto=fuzzy

# ========== 关闭自动加载icc，提速 ==========
icc-profile-auto=no
# ========== 降低同步/脚本消耗 ==========
# 禁用统计信息/调试输出
terminal=no
msg-level=all=error
# ===========
save-position-on-quit = yes
# 让弹幕更流畅，会增加cpu压力，默认关闭
# video-sync=display-resample
autofit=60%

watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# ========= 自动加载文件夹内所有视频 ==========
autocreate-playlist=same
directory-mode=ignore

# 播放网络视频时立即显示 mpv 窗口
force-window=immediate
# 播放完不自动退出
idle=yes


# === HDR 核心 注：新增配置字段的话请务必在此上方添加（但不建议直接修改mpv.conf文件，原因见顶部说明），否则配置可能无效====
# ====================================================================
# 跨平台通用基础渲染设置（所有系统共用）
# 根据显示输出环境选择目标色彩空间。
# HDR 显示环境 → HDR 输出
# SDR 显示环境 → 将 HDR 视频映射到 SDR
# ====================================================================
target-colorspace-hint=yes              # 核心！自动检测系统 HDR 状态，开启则真 HDR 输出，关闭则转 SDR
tone-mapping=spline                     # 顶级的样条线色调映射算法，在 SDR 屏幕上转换 HDR
hwdec=auto                              # 硬件解码自动，根据系统和视频自动选择最佳解码方式
target-peak=auto                        # 自动获取目标峰值亮度

# ============================================================
# 平台特定优化（覆盖 vo 和 hwdec）
# ============================================================
# Windows
[win]
profile-cond=platform == "win32"
profile-restore=copy
vo=gpu-next
gpu-api=auto

# Linux
[linux]
profile-cond=platform == "linux"
profile-restore=copy
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe                         # Linux 下硬件解码自动选择，避免部分机型解码崩溃

# macOS Apple Silicon
[macos-arm]
profile-cond=platform == "darwin" and os.exec("uname -m") == "arm64"
profile-restore=copy
vo=gpu-next
gpu-api=vulkan

# =======================================
# Directly modifying mpv.conf is NOT recommended; see the instructions at the top for the reason.
# 不建议直接修改mpv.conf文件，原因见顶部说明
# =======================================