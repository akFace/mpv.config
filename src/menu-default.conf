# Default style
# mpvnet style

# ============================================================
# 字体 (Font)
# ============================================================

font_name=""
font_size=16
bold=no
italic=no

# ============================================================
# 菜单尺寸 (Menu Size)
# ============================================================

row_height=26
separator_height=7
padding_x=13
padding_y=7

# 一级菜单 / 子菜单文字缩进 (Root menu / child menu text indent)
root_indent_chars=0.6
child_indent_chars=0.8

# ============================================================
# 菜单主体 (Menu Body)
# ============================================================

background=#2C2C2E
border=#5A5A5F
border_width=1
radius=7

# 普通文字 (Normal text)
text=#F2F2F7
disabled_text=#8E8E93

# ============================================================
# mpv.net 风格灰色整行高亮 (mpv.net style gray whole-row highlight)
# ============================================================

hover_bg=#505050
hover_text=#FFFFFF

# 选中状态不单独加边框；保持扁平整行高亮 (No separate border for selected state; keep flat whole-row highlight)
hover_border=#00000000
hover_border_width=0
hover_corner_radius=0

# ============================================================
# 快捷键 (Shortcut)
# ============================================================

shortcut=#D1D1D6
hover_shortcut=#FFFFFF
shortcut_gap=4
# 快捷键统一右对齐的右侧间距；有子菜单时表示快捷键与箭头之间的距离（Shortcut key uniform right-aligned right spacing; when there is a submenu, it indicates the distance between the shortcut key and the arrow）
shortcut_right_gap=2

# ============================================================
# 子菜单箭头 (Submenu Arrow)
# ============================================================

# 非选中状态保持清晰可见 (Keep clearly visible when not selected)
arrow=#E5E5EA
arrow_alpha=0

# 选中状态变白 (Turn white when selected)
hover_arrow=#FFFFFF
hover_arrow_alpha=0

arrow_width=18
arrow_font_size=24

# Hover 背景相对菜单外框的左右/上下留白（像素）
hover_margin_x=1
hover_margin_y=0

# ============================================================
# 分隔线 / 勾选 (Separator / Check mark)
# ============================================================

separator=#636366
check=#F2F2F7

# ============================================================
# 阴影 (Shadow)
# ============================================================

shadow=#000000
bg_alpha=0
shadow_alpha=90
shadow_blur=7

# 子菜单之间的间距 (Gap between submenus)
submenu_gap=4
screen_margin=6

# ============================================================
# 菜单宽度 (Menu Width)
# ============================================================

min_width=220
max_width=600
max_visible_rows=0

# 鼠标经过立即展开子菜单 (Expand submenu immediately on mouse hover)
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线 (Do not show internal input.conf separators in root menu)
hide_root_separators=yes

# ============================================================
# 播放列表 (Playlist)
# ============================================================

playlist_header_indent_chars=1
# 播放列表条目右侧格式后缀（MKV/MP4 等）额外左移的距离（The extra left shift distance of the format suffix (MKV/MP4, etc.) on the right side of the playlist entry）
playlist_shortcut_right_gap=2

# ============================================================
# Modal
# ============================================================

modal_mask=yes
modal_mask_alpha=255
modal_z=1000000

# ============================================================
# 长菜单滚动 (Long Menu Scrolling)
# ============================================================

scroll_threshold=0.80
scrollbar_width=5
scrollbar_gap=0
scrollbar_right_gap=1
scrollbar_min_thumb=20

scrollbar_track=#48484A
scrollbar_thumb=#8E8E93
scrollbar_track_alpha=70
scrollbar_thumb_alpha=145
scroll_step=1

# UI DPI 自适应缩放（参考 ModernZ/uosc 思路）
# auto: 根据当前 OSD 分辨率自动计算
ui_scale=auto
# 设计基准分辨率
design_width=1920
design_height=1080
# 最小/最大缩放范围
min_ui_scale=0.8
max_ui_scale=1.6
# macOS Retina 字体视觉补偿
macos_font_scale=1.6