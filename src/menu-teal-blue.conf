# Default style
# mpvnet style - Screenshot Blue Dark

# ============================================================
# 字体 (Font)
# ============================================================

font_name=""
font_size=16
bold=no
italic=no

# ============================================================
# 菜单尺寸 (Menu Size)
# ============================================================

# 保持原尺寸
row_height=26
separator_height=7
padding_x=13
padding_y=7

# 一级菜单 / 子菜单文字缩进
root_indent_chars=0.6
child_indent_chars=0.8

# ============================================================
# 菜单主体 (Menu Body)
# ============================================================

# 截图中的深蓝黑色背景
background=#101B26

# 青蓝色外框
border=#076792
border_width=1
radius=8

# ============================================================
# 普通文字 (Normal text)
# ============================================================

text=#D7DCE2
disabled_text=#7F8A95

# ============================================================
# 选中状态 / Hover
# ============================================================

# 截图中的深蓝色整行高亮
hover_bg=#0B4169
hover_text=#FFFFFF

# 不单独绘制选中边框
hover_border=#00000000
hover_border_width=0
hover_corner_radius=6

# ============================================================
# 快捷键 (Shortcut)
# ============================================================

shortcut=#D0D6DC
hover_shortcut=#FFFFFF
shortcut_gap=4

# 快捷键右侧间距保持原值
shortcut_right_gap=2

# ============================================================
# 子菜单箭头 (Submenu Arrow)
# ============================================================

arrow=#D7DCE2
arrow_alpha=0

hover_arrow=#FFFFFF
hover_arrow_alpha=0

arrow_width=18
arrow_font_size=24

# Hover 背景相对菜单外框的左右/上下留白
hover_margin_x=6
hover_margin_y=0

# ============================================================
# 分隔线 / 勾选 (Separator / Check mark)
# ============================================================

separator=#263B4B
check=#D7DCE2

# ============================================================
# 阴影 (Shadow)
# ============================================================

shadow=#000000
bg_alpha=0
shadow_alpha=100
shadow_blur=12

# 子菜单之间的间距
submenu_gap=4
screen_margin=6

# ============================================================
# 菜单宽度 (Menu Width)
# ============================================================

min_width=210
max_width=600
max_visible_rows=0

# 鼠标经过立即展开子菜单
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线
hide_root_separators=yes

# ============================================================
# 播放列表 (Playlist)
# ============================================================

playlist_header_indent_chars=1
playlist_shortcut_right_gap=2

# ============================================================
# Modal
# ============================================================

modal_mask=yes
modal_mask_alpha=255
modal_z=1000000

# ============================================================
# 长菜单滚动 (Long Menu Scrolling)
# ============================================================

scroll_threshold=0.80
scrollbar_width=5
scrollbar_gap=0
scrollbar_right_gap=1
scrollbar_min_thumb=20

scrollbar_track=#182B3A
scrollbar_thumb=#647783
scrollbar_track_alpha=70
scrollbar_thumb_alpha=145
scroll_step=1

# ============================================================
# UI DPI 自适应缩放
# ============================================================

ui_scale=auto
design_width=1920
design_height=1080
min_ui_scale=0.8
max_ui_scale=1.6

# macOS Retina 字体视觉补偿
macos_font_scale=1.6