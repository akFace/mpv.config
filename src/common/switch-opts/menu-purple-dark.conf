# Default style
# mpvnet style - Screenshot Blue Dark

# ============================================================
# 字体 (Font)
# ============================================================

font_name=""
font_size=16
bold=no
italic=no

# ============================================================
# 菜单尺寸 (Menu Size)
# ============================================================

# 保持原尺寸
row_height=26
separator_height=7
padding_x=13
padding_y=7

# 一级菜单 / 子菜单文字缩进
root_indent_chars=0.6
child_indent_chars=0.8

# ============================================================
# 菜单主体 (Menu Body)
# ============================================================

# 极深暗黑色背景（比纯黑柔和，比灰更稳重）
background=#141418

# 边框：使用低饱和度的暗紫作为底线，防止边框过于抢眼
border=#3D264D
border_width=1
radius=8

# ============================================================
# 普通文字 (Normal text)
# ============================================================

# 柔和的灰白，不刺眼
text=#D4D6DD
# 禁用文字：偏暗的灰蓝色
disabled_text=#5A5D6E

# ============================================================
# 选中状态 / Hover
# ============================================================

# 选中背景：深紫罗兰色（呼应截图中的紫色按钮，但暗化以适配背景）
hover_bg=#3B2B5E
hover_text=#FFFFFF

# 不单独绘制选中边框
hover_border=#00000000
hover_border_width=0
hover_corner_radius=6

# ============================================================
# 快捷键 (Shortcut)
# ============================================================

# 快捷键颜色：稍微偏暗的灰色，比正文弱一点
shortcut=#8A8D9E
hover_shortcut=#FFFFFF
shortcut_gap=4

# 快捷键右侧间距保持原值
shortcut_right_gap=2

# ============================================================
# 子菜单箭头 (Submenu Arrow)
# ============================================================

# 箭头颜色与正文一致
arrow=#D4D6DD
arrow_alpha=0

hover_arrow=#FFFFFF
hover_arrow_alpha=0

arrow_width=18
arrow_font_size=24

# Hover 背景相对菜单外框的左右/上下留白
hover_margin_x=6
hover_margin_y=0

# ============================================================
# 分隔线 / 勾选 (Separator / Check mark)
# ============================================================

# 分隔线：低调的深灰紫
separator=#26232C
check=#D4D6DD

# ============================================================
# 阴影 (Shadow)
# ============================================================

shadow=#000000
bg_alpha=30
shadow_alpha=100
shadow_blur=12

# 子菜单之间的间距
submenu_gap=4
screen_margin=6

# ============================================================
# 菜单宽度 (Menu Width)
# ============================================================

min_width=210
max_width=600
max_visible_rows=0

# 鼠标经过立即展开子菜单
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线
hide_root_separators=yes

# ============================================================
# 播放列表 (Playlist)
# ============================================================

playlist_header_indent_chars=1
playlist_shortcut_right_gap=2

# ============================================================
# Modal
# ============================================================

modal_mask=yes
modal_mask_alpha=255
modal_z=1000000

# ============================================================
# 长菜单滚动 (Long Menu Scrolling)
# ============================================================

scroll_threshold=0.80
scrollbar_width=5
scrollbar_gap=0
scrollbar_right_gap=1
scrollbar_min_thumb=20

# 滚动条轨道：深灰紫
scrollbar_track=#1F1D23
# 滚动条滑块：亮紫色（呼应进度条，作为小面积点缀）
scrollbar_thumb=#8C33FF
scrollbar_track_alpha=70
scrollbar_thumb_alpha=145
scroll_step=1

# ============================================================
# UI DPI 自适应缩放
# ============================================================

ui_scale=auto
design_width=1920
design_height=1080
min_ui_scale=0.8
max_ui_scale=1.6

# macOS Retina 字体视觉补偿
macos_font_scale=1.6