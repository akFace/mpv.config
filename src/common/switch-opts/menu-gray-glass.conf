# Default style
# mpvnet style - Screenshot Blue Dark

# ============================================================
# 字体 (Font)
# ============================================================

bold=no
italic=no

# ============================================================
# 菜单尺寸 (Menu Size)
# ============================================================

# 保持原尺寸
menu_item_height=30
scale=1
scale_fullscreen=1.2
menu_font_scale=1
font_size_ratio=0.54
arrow_font_ratio=1.48

separator_height=7
padding_x=12
padding_y=10

# 一级菜单 / 子菜单文字缩进
root_indent_chars=0.7
child_indent_chars=0.7

# ============================================================
# 菜单主体 (Menu Body)
# ============================================================
# 液态玻璃效果
glass_enabled=yes
# 灰白半透明玻璃底，尽量接近图二的毛玻璃观感
background=#000000

# 亮灰白玻璃边缘，模拟图二那种细亮边
border=#666667
border_width=1
radius=18

# ============================================================
# 普通文字 (Normal text)
# ============================================================

# 接近纯白，保证在毛玻璃上清晰
text=#F2F2F5
# 禁用文字：中灰
disabled_text=#8A8A92

# ============================================================
# 选中状态 / Hover
# ============================================================

# 图二那种白色高光选中条
hover_bg=#777777
hover_text=#FFFFFF

# 选中时不要额外边框，保持干净
hover_border=#777777
hover_border_width=0
hover_corner_radius=14

# ============================================================
# 快捷键 (Shortcut)
# ============================================================

# 快捷键：浅灰，比正文弱一点
shortcut=#aaaaaa
hover_shortcut=#aaaaaa
shortcut_gap=7

# 快捷键右侧间距保持原值
shortcut_right_gap=4

# ============================================================
# 子菜单箭头 (Submenu Arrow)
# ============================================================

# 箭头颜色与正文一致
arrow=#aaaaaa
arrow_alpha=0

hover_arrow=#aaaaaa
hover_arrow_alpha=0

arrow_width=34
arrow_font_size=42

# Hover 背景相对菜单外框的左右/上下留白
hover_margin_x=8
hover_margin_y=1

# ============================================================
# 分隔线 / 勾选 (Separator / Check mark)
# ============================================================

# 分隔线：半透明白灰，像玻璃上的细线
separator=#6A6A72
check=#F2F2F5

# ============================================================
# 阴影 (Shadow)
# ============================================================

# 柔和深阴影，让玻璃浮起来
shadow=#000000
bg_alpha=130
shadow_alpha=180
shadow_blur=4

# 子菜单之间的间距
submenu_gap=4
screen_margin=11

# ============================================================
# 菜单宽度 (Menu Width)
# ============================================================

min_width=260
max_width=1000
max_visible_rows=0

# 鼠标经过立即展开子菜单
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线
hide_root_separators=yes

# ============================================================
# 播放列表 (Playlist)
# ============================================================

playlist_header_indent_chars=1
playlist_shortcut_right_gap=4

# ============================================================
# Modal
# ============================================================

modal_mask=no
modal_mask_alpha=255
modal_z=1800000

# ============================================================
# 长菜单滚动 (Long Menu Scrolling)
# ============================================================

scroll_threshold=0.80
scrollbar_width=9
scrollbar_gap=0
scrollbar_right_gap=2
scrollbar_min_thumb=36

# 滚动条轨道：半透明灰
scrollbar_track=#3A3A40
# 滚动条滑块：亮白灰
scrollbar_thumb=#D0D0D8
scrollbar_track_alpha=80
scrollbar_thumb_alpha=180
scroll_step=2
# macOS Retina 字体视觉补偿
macos_font_scale=1