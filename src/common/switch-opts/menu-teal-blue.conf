# Default style
# mpvnet style - Screenshot Blue Dark

# ============================================================
# 字体 (Font)
# ============================================================

bold=no
italic=no

# ============================================================
# 菜单尺寸 (Menu Size)
# ============================================================

# 保持原尺寸
menu_item_height=30
scale=1
scale_fullscreen=1.2
menu_font_scale=1
font_size_ratio=0.54
arrow_font_ratio=1.48

separator_width=0.7
separator_height=7
padding_x=12
padding_y=10

# 一级菜单 / 子菜单文字缩进
root_indent_chars=0.7
child_indent_chars=0.7

# ============================================================
# 菜单主体 (Menu Body)
# ============================================================

# 截图中的深蓝黑色背景
background=#101B26

# 青蓝色外框
border=#076792
border_width=1
radius=10

# ============================================================
# 普通文字 (Normal text)
# ============================================================

text=#D7DCE2
disabled_text=#7F8A95

# ============================================================
# 选中状态 / Hover
# ============================================================

# 截图中的深蓝色整行高亮
hover_bg=#0B4169
hover_text=#FFFFFF

# 不单独绘制选中边框
hover_border=#00000000
hover_border_width=0
hover_corner_radius=8

# ============================================================
# 快捷键 (Shortcut)
# ============================================================

shortcut=#8A8D9E
hover_shortcut=#8A8D9E
shortcut_gap=7

# 快捷键右侧间距保持原值
shortcut_right_gap=4

# ============================================================
# 子菜单箭头 (Submenu Arrow)
# ============================================================

arrow=#8A8D9E
arrow_alpha=0

hover_arrow=#8A8D9E
hover_arrow_alpha=0

arrow_width=34
arrow_font_size=42

# Hover 背景相对菜单外框的左右/上下留白
hover_margin_x=8
hover_margin_y=1

# ============================================================
# 分隔线 / 勾选 (Separator / Check mark)
# ============================================================

separator=#263B4B
check=#D7DCE2

# ============================================================
# 阴影 (Shadow)
# ============================================================

shadow=#000000
bg_alpha=60
shadow_alpha=100
shadow_blur=4

# 子菜单之间的间距
submenu_gap=4
screen_margin=11

# ============================================================
# 菜单宽度 (Menu Width)
# ============================================================

min_width=260
max_width=1000
max_visible_rows=0

# 鼠标经过立即展开子菜单
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线
hide_root_separators=yes

# ============================================================
# 播放列表 (Playlist)
# ============================================================

playlist_header_indent_chars=1
playlist_shortcut_right_gap=4

# ============================================================
# Modal
# ============================================================

modal_mask=no
modal_mask_alpha=255
modal_z=1800000

# ============================================================
# 长菜单滚动 (Long Menu Scrolling)
# ============================================================

scroll_threshold=0.80
scrollbar_width=9
scrollbar_gap=0
scrollbar_right_gap=2
scrollbar_min_thumb=36

scrollbar_track=#182B3A
scrollbar_thumb=#647783
scrollbar_track_alpha=70
scrollbar_thumb_alpha=145
scroll_step=2
# macOS Retina 字体视觉补偿
macos_font_scale=1