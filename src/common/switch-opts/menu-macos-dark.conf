# macOS 深色风格
# 仅调整视觉/交互参数，不修改菜单功能。

# ============================================================
# 字体
# ============================================================

font_name="PingFang SC"

bold=no
italic=no

# ============================================================
# 菜单尺寸
# ============================================================

menu_item_height=29
scale=1
scale_fullscreen=1.2
menu_font_scale=1
font_size_ratio=0.54
arrow_font_ratio=1.48

separator_width=0.7
separator_height=7
padding_x=12
padding_y=10

# 一级菜单 / 子菜单文字缩进
root_indent_chars=0.7
child_indent_chars=0.7

# ============================================================
# macOS 深色菜单主体
# ============================================================

background=#2C2C2E
border=#5A5A5F
border_width=1
radius=14

# 普通文字
text=#F2F2F7
disabled_text=#8E8E93

# ============================================================
# macOS 深色选中状态
# ============================================================

# macOS 风格系统蓝
hover_bg=#0A84FF
hover_text=#FFFFFF

# 选中项圆角
hover_border=#00000000
hover_border_width=0
hover_corner_radius=12

# Hover 背景相对菜单外框的左右/上下留白（像素）
hover_margin_x=8
hover_margin_y=1

# ============================================================
# 快捷键
# ============================================================

shortcut=#8A8D9E
hover_shortcut=#FFFFFF
shortcut_gap=7
shortcut_right_gap=4

# ============================================================
# 子菜单箭头
# ============================================================

# 非选中状态保持清晰可见
arrow=#8A8D9E
arrow_alpha=0

# 选中状态变白
hover_arrow=#FFFFFF
hover_arrow_alpha=0

arrow_width=34
arrow_font_size=42

# ============================================================
# 分隔线 / 勾选
# ============================================================

separator=#636366
check=#F2F2F7

# ============================================================
# 阴影
# ============================================================

shadow=#000000
bg_alpha=60
shadow_alpha=90
shadow_blur=4

# 子菜单之间的间距
submenu_gap=4
screen_margin=11

# ============================================================
# 菜单宽度
# ============================================================

min_width=260
max_width=1000
max_visible_rows=0

# 鼠标经过立即展开子菜单
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线
hide_root_separators=yes

# ============================================================
# 播放列表
# ============================================================

playlist_header_indent_chars=1
playlist_shortcut_right_gap=4

# ============================================================
# Modal
# ============================================================

modal_mask=no
modal_mask_alpha=255
modal_z=1800000

# ============================================================
# 长菜单滚动
# ============================================================

scroll_threshold=0.80
scrollbar_width=5
scrollbar_gap=0
scrollbar_right_gap=2
scrollbar_min_thumb=36

scrollbar_track=#48484A
scrollbar_thumb=#8E8E93
scrollbar_track_alpha=70
scrollbar_thumb_alpha=145
scroll_step=2

# UI DPI 自适应缩放（参考 ModernZ/uosc 思路）
# auto: 根据当前 OSD 分辨率自动计算
ui_scale=no
# 设计基准分辨率
design_width=1920
design_height=1080
# 最小/最大缩放范围
min_ui_scale=0.8
max_ui_scale=1.6
# macOS Retina 字体视觉补偿
macos_font_scale=1