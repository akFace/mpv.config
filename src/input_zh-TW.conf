# ===========================================================================
#  請注意！！！不建議直接修改此檔案
# ===========================================================================
# https://mpvconfig.github.io/docs/custom.html
# 若要增加或者修改快速鍵/選單，請在 input.conf 檔案同目錄下，新建檔案並重新命名為：custom-input.conf，然後在裡邊增加或修改快速鍵/選單，寫法和 input.conf 一致。
# 修改完後請在播放器中，按右鍵：工具 > 合併自訂快速鍵/選單  合併後重新啟動播放器生效
# 這樣做的目的是避免直接修改 input.conf 導致更新覆蓋，遺失了自己新增/修改的內容。
# ===========================================================================

# 右鍵選單以及快速鍵設定檔
Ctrl+o  script-message-to menu open               #menu: 開啟 > 檔案...
Ctrl+O  script-message-to menu open-folder        #menu: 開啟 > 資料夾...
_           script-message-to dialog open append  #menu: 開啟 > 加入至播放清單...
_           ignore                                #menu: 開啟 > -
_           script-message-to dialog open bd-iso  #menu: 開啟 > 藍光 ISO...
_           script-message-to dialog open dvd-iso #menu: 開啟 > DVD ISO...
_           ignore                                #menu: 開啟 > -
Ctrl+v  script-message-to menu open-clipboard     #menu: 開啟 > 剪貼簿
_           ignore                                #menu: 開啟 > -
_                script-binding recentmenu/open        #menu: 開啟 > 最近播放 #@recent
Ctrl+R  script-message-to recentmenu open-recent-menu  #menu: 開啟 > 最近播放清單
_                 script-binding recentmenu/clear      #menu: 開啟 > 清空最近播放清單


Space       cycle pause                           #menu: 播放 > 播放/暫停 #@state=(idle_active and 'disabled' or (pause or 'hidden'))
Ctrl+s      stop                                  #menu: 播放 > 停止 #@state=(idle_active and 'disabled')
_           ignore                                #menu: 播放 > -
l       ab-loop                                   #menu: 播放 > 設定/清除 A-B 循環點
L       cycle-values loop-file inf no             #menu: 播放 > 切換循環播放
_ script-message-to skip_intro set-mark start       #menu: 播放 > 片頭／片尾標記 > 設定目前為片頭
_ script-message-to skip_intro set-mark end         #menu: 播放 > 片頭／片尾標記 > 設定目前為片尾
_ script-message-to skip_intro clear-marks          #menu: 播放 > 片頭／片尾標記 > 清空目前標記
_ script-message-to skip_intro clear-all-marks      #menu: 播放 > 片頭／片尾標記 > 清空所有標記
_ script-message-to skip_intro goto-mark start      #menu: 播放 > 片頭／片尾標記 > 跳到片頭
_ script-message-to skip_intro goto-mark end        #menu: 播放 > 片頭／片尾標記 > 跳到片尾
_ script-message-to skip_intro show-marks           #menu: 播放 > 片頭／片尾標記 > 顯示標記
_ script-message-to skip_intro toggle-auto-start    #menu: 播放 > 片頭／片尾標記 > 自動跳過片頭 #@state=(ud_skip_intro_auto_skip_start and 'checked')
_ script-message-to skip_intro toggle-auto-end      #menu: 播放 > 片頭／片尾標記 > 自動跳過片尾 #@state=(ud_skip_intro_auto_skip_end and 'checked')

_           ignore                                #menu: 導覽 > 章節 #@chapters
F12         playlist-next                         #menu: 導覽 > 下個檔案
F11         playlist-prev                         #menu: 導覽 > 上個檔案
_           ignore                                #menu: 導覽 > -
PGUP        add chapter  1                        #menu: 導覽 > 下一章節
PGDWN       add chapter -1                        #menu: 導覽 > 上一章節
_           ignore                                #menu: 導覽 > -
.           frame-step                            #menu: 導覽 > 下一影格
,           frame-back-step                       #menu: 導覽 > 上一影格
_           ignore                                #menu: 導覽 > -
Right       seek  5                               #menu: 導覽 > 前進 5 秒
Left        seek -5                               #menu: 導覽 > 後退 5 秒
_           ignore                                #menu: 導覽 > -
Up          seek  30                              #menu: 導覽 > 前進 30 秒
Down        seek -30                              #menu: 導覽 > 後退 30 秒
_           ignore                                #menu: 導覽 > -
Ctrl+Right  seek  300                             #menu: 導覽 > 前進 5 分鐘
Ctrl+Left   seek -300                             #menu: 導覽 > 後退 5 分鐘

               
_           ignore                                #menu: 軌道 #@tracks
_           ignore                                #menu: 播放版本 #@editions
_           ignore                                #menu: 播放清單 #@playlist

[           add speed -0.1                        #menu: 影片 > 速度 > -10%
]           add speed 0.1                         #menu: 影片 > 速度 > +10%
_           ignore                                #menu: 影片 > 速度 > -
{           multiply speed 0.5                    #menu: 影片 > 速度 > 減半
}           multiply speed 2.0                    #menu: 影片 > 速度 > 翻倍
_           ignore                                #menu: 影片 > 速度 > -
_           set speed 0.5                         #menu: 影片 > 速度 > 0.5 倍
_           set speed 0.75                        #menu: 影片 > 速度 > 0.75 倍
_           set speed 1.0                         #menu: 影片 > 速度 > 1.0 倍
_           set speed 1.25                        #menu: 影片 > 速度 > 1.25 倍
_           set speed 1.5                         #menu: 影片 > 速度 > 1.5 倍
_           set speed 2.0                         #menu: 影片 > 速度 > 2.0 倍
_           ignore                                #menu: 影片 > 速度 > -
BS          set speed 1                           #menu: 影片 > 速度 > 重設
KP8         cycle video                           #menu: 影片 > 切換軌道 #@tracks/video
_           set hwdec "no"                        #menu: 影片 > 解碼方式 > 軟體解碼
_           set hwdec "auto-safe"                 #menu: 影片 > 解碼方式 > 自動選擇硬體加速
_           set hwdec "auto-copy-safe"            #menu: 影片 > 解碼方式 > 自動選擇回傳式硬體加速
_           set hwdec "nvdec"                     #menu: 影片 > 解碼方式 > NVDEC 硬體解碼
_           set hwdec "d3d11va"                   #menu: 影片 > 解碼方式 > D3D11VA 硬體解碼
_           set hwdec "nvdec-copy"                #menu: 影片 > 解碼方式 > NVDEC 回傳式硬體解碼
_           set hwdec "d3d12va-copy"              #menu: 影片 > 解碼方式 > D3D12VA 回傳式硬體解碼
_           set hwdec "d3d11va-copy"              #menu: 影片 > 解碼方式 > D3D11VA 回傳式硬體解碼
_           set video-sync audio;show-text "幀同步模式:${video-sync}"                   #menu: 影片 > 影格同步模式 > audio #@state=(video_sync == "audio" and 'checked')
_           set video-sync display-resample;show-text "幀同步模式:${video-sync}"        #menu: 影片 > 影格同步模式 > display-resample #@state=(video_sync == "display-resample" and 'checked')
_           set video-sync display-tempo;show-text "幀同步模式:${video-sync}"           #menu: 影片 > 影格同步模式 > display-tempo #@state=(video_sync == "display-tempo" and 'checked')
_           set video-sync display-vdrop;show-text "幀同步模式:${video-sync}"           #menu: 影片 > 影格同步模式 > display-vdrop #@state=(video_sync == "display-vdrop" and 'checked')
_           set video-sync display-resample-vdrop;show-text "幀同步模式:${video-sync}"  #menu: 影片 > 影格同步模式 > display-resample-vdrop #@state=(video_sync == "display-resample-vdrop" and 'checked')
_           cycle-values  video-sync display-resample display-tempo audio display-vdrop display-resample-vdrop;show-text "幀同步模式:${video-sync}"  #menu: 影片 > 影格同步模式 > 循環切換
H           cycle-values tone-mapping auto spline bt.2390 hable bt.2446a st2094-40 st2094-10;show-text "HDR 映射曲線:${tone-mapping}"   #menu: 影片 > HDR > 切換 HDR 映射曲線
Ctrl+h      cycle-values hdr-compute-peak yes no;show-text "HDR 動態映射:${hdr-compute-peak}"                      #menu: 影片 > HDR > 切換 HDR 動態映射  #@state=(hdr_compute_peak and 'checked')
Ctrl+H      cycle target-colorspace-hint;show-text "HDR 直通模式:${target-colorspace-hint}"                        #menu: 影片 > HDR > 切換 HDR 直通模式  #@state=(target_colorspace_hint and 'checked')
Ctrl+q      cycle-values target-trc auto pq gamma2.2;show-text "顯示器傳輸特性:${target-trc}"                      #menu: 影片 > HDR > 切換 顯示器傳輸特性
Ctrl+b      cycle-values hdr-reference-white 100 203;show-text "HDR 參考白亮度:${hdr-reference-white}"             #menu: 影片 > HDR > 切換 HDR 參考白亮度
Ctrl+g      cycle gamut-mapping-mode ;show-text "色域映射模式:${gamut-mapping-mode}"                               #menu: 影片 > HDR > 切換 色域映射模式
_           script-message-to dialog open add-video #menu: 影片 > 載入檔案... #@state=(idle_active and 'disabled')
_           ignore                                #menu: 影片 > -
_           script-binding mpv360/toggle                #menu: 影片 > 360°VR > 開啟/關閉
Ctrl+MBTN_LEFT script-binding mpv360/toggle-mouse-look  #menu: 影片 > 360°VR > 滑鼠跟隨視角 (Ctrl+左鍵)
Ctrl+WHEEL_UP  script-binding mpv360/fov-decrease       #menu: 影片 > 360°VR > 縮小視野（Ctrl+滾輪）
Ctrl+WHEEL_DOWN   script-binding mpv360/fov-increase    #menu: 影片 > 360°VR > 擴大視野（Ctrl+滾輪）
Alt+g           script-binding mpv360/reset-view        #menu: 影片 > 360°VR > 重設視角
_           script-binding mpv360/switch-eye            #menu: 影片 > 360°VR > 切換左右眼
_          script-binding mpv360/cycle-sampling         #menu: 影片 > 360°VR > 取樣
_          script-binding mpv360/cycle-projection       #menu: 影片 > 360°VR > 投影
Alt+h           script-binding mpv360/show-help         #menu: 影片 > 360°VR > 說明
_           ignore                                #menu: 影片 > -
Ctrl+1      add contrast -1                       #menu: 影片 > 調色 > 對比 -1
Ctrl+2      add contrast  1                       #menu: 影片 > 調色 > 對比 +1
_           ignore                                #menu: 影片 > 調色 > -
Ctrl+3      add brightness -1                     #menu: 影片 > 調色 > 亮度 -1
Ctrl+4      add brightness  1                     #menu: 影片 > 調色 > 亮度 +1
_           ignore                                #menu: 影片 > 調色 > -
Ctrl+5      add gamma -1                          #menu: 影片 > 調色 > 伽馬 -1
Ctrl+6      add gamma  1                          #menu: 影片 > 調色 > 伽馬 +1
_           ignore                                #menu: 影片 > 調色 > -
Ctrl+7      add saturation -1                     #menu: 影片 > 調色 > 飽和度 -1
Ctrl+8      add saturation  1                     #menu: 影片 > 調色 > 飽和度 +1
_           ignore                                #menu: 影片 > 調色 > -
Ctrl+9      add hue -1                            #menu: 影片 > 調色 > 色調 -1
Ctrl+0      add hue  1                            #menu: 影片 > 調色 > 色調 +1
_           ignore                                #menu: 影片 > 調色 > -
_           set contrast 0; set brightness 0; set gamma 0; set saturation 0; set hue 0 #menu: 影片 > 調色 > 重設
Ctrl+I      cycle icc-profile-auto                #menu: 影片 > 自動 ICC 設定 #@state=(icc_profile_auto and 'checked')
_           ignore                                #menu: 影片 > -
Ctrl+r      cycle-values video-rotate 90 180 270 0 #menu: 影片 > 旋轉
Ctrl+-      add video-zoom -0.1                   #menu: 影片 > 縮放 > 縮小
Ctrl+=      add video-zoom  0.1                   #menu: 影片 > 縮放 > 放大
Ctrl+KP4    add video-pan-x -0.01                 #menu: 影片 > 平移 > 左移
Ctrl+KP6    add video-pan-x  0.01                 #menu: 影片 > 平移 > 右移
_           ignore                                #menu: 影片 > 平移 > -
Ctrl+KP8    add video-pan-y -0.01                 #menu: 影片 > 平移 > 上移
Ctrl+KP2    add video-pan-y  0.01                 #menu: 影片 > 平移 > 下移
Ctrl+BS     set video-zoom 0; set video-pan-x 0; set video-pan-y 0 #menu: 影片 > 平移 > 重設
a cycle-values video-aspect-override 16:9 4:3 2.35:1 0 -1    #menu: 影片 > 比例 > 切換
_           set video-aspect-override 16:9        #menu: 影片 > 比例 > 16:9
_           set video-aspect-override 4:3         #menu: 影片 > 比例 > 4:3
_           set video-aspect-override 2.35:1      #menu: 影片 > 比例 > 2.35:1
_           set video-aspect-override -1          #menu: 影片 > 比例 > 自動

