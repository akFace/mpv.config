# mpv-menu-plugin-next · macOS 浅色风格
font_name="PingFang SC"
font_size=24
bold=no
italic=no
row_height=36
separator_height=7
padding_x=13
padding_y=7
root_indent_chars=1
child_indent_chars=1
background=#E7E8E5
border=#C6AFC4
border_width=1
corner_radius=10
text=#222222
disabled_text=#999999
hover_bg=#0A84FF
hover_text=#FFFFFF
hover_border=#00000000
hover_border_width=0
hover_corner_radius=7
shortcut=#5F5F64
hover_shortcut=#FFFFFF
shortcut_gap=4
arrow=#333333
arrow_alpha=0
hover_arrow=#FFFFFF
hover_arrow_alpha=0
arrow_width=18
arrow_font_size=30
separator=#B8B8BC
check=#222222
shadow=#000000
bg_alpha=0
shadow_alpha=70
shadow_blur=6
submenu_gap=4
screen_margin=6
min_width=320
max_width=640
max_visible_rows=0
click_to_show_submenus=no
hide_root_separators=yes
playlist_header_indent_chars=1
menu_z=10000
suppress_osc=yes
suppress_mouse_move=yes
modal_mask=yes
modal_mask_alpha=255
modal_z=1000000
scroll_threshold=0.80
scrollbar_width=5
scrollbar_gap=0
scrollbar_right_gap=1
scrollbar_min_thumb=20
scrollbar_track=#B8B8BC
scrollbar_thumb=#737377
scrollbar_track_alpha=70
scrollbar_thumb_alpha=140
scroll_step=1

# Hover 背景相对菜单外框的左右/上下留白（像素）
hover_margin_x=10
hover_margin_y=0
# 快捷键统一右对齐的右侧间距；有子菜单时表示快捷键与箭头之间的距离
shortcut_right_gap=2
# 播放列表条目右侧格式后缀（MKV/MP4 等）额外左移的距离
playlist_shortcut_right_gap=6
