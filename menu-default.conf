# Default style
# mpvnet style

# ============================================================
# 字体
# ============================================================

font_name=""
font_size=26
bold=no
italic=no

# ============================================================
# 菜单尺寸
# ============================================================

row_height=38
separator_height=7
padding_x=10
padding_y=10

# 一级菜单 / 子菜单文字缩进
root_indent_chars=1.5
child_indent_chars=1

# ============================================================
# 菜单主体
# ============================================================

background=#2C2C2E
border=#5A5A5F
border_width=1
corner_radius=10

# 普通文字
text=#F2F2F7
disabled_text=#8E8E93

# ============================================================
# mpv.net 风格灰色整行高亮
# ============================================================

hover_bg=#505050
hover_text=#FFFFFF

# 选中状态不单独加边框；保持扁平整行高亮
hover_border=#00000000
hover_border_width=0
hover_corner_radius=0

# ============================================================
# 快捷键
# ============================================================

shortcut=#D1D1D6
hover_shortcut=#FFFFFF
shortcut_gap=6

# ============================================================
# 子菜单箭头
# ============================================================

# 非选中状态保持清晰可见
arrow=#E5E5EA
arrow_alpha=0

# 选中状态变白
hover_arrow=#FFFFFF
hover_arrow_alpha=0

arrow_width=18
arrow_font_size=30

# ============================================================
# 分隔线 / 勾选
# ============================================================

separator=#636366
check=#F2F2F7

# ============================================================
# 阴影
# ============================================================

shadow=#000000
bg_alpha=0
shadow_alpha=90
shadow_blur=7

# 子菜单之间的间距
submenu_gap=4
screen_margin=6

# ============================================================
# 菜单宽度
# ============================================================

min_width=320
max_width=640
max_visible_rows=0

# 鼠标经过立即展开子菜单
click_to_show_submenus=no

# 一级菜单不显示内部 input.conf 分隔线
hide_root_separators=yes

# ============================================================
# 播放列表
# ============================================================

playlist_header_indent_chars=1

# ============================================================
# Modal
# ============================================================

menu_z=10000
suppress_osc=yes
suppress_mouse_move=yes

modal_mask=yes
modal_mask_alpha=255
modal_z=1000000

# ============================================================
# 长菜单滚动
# ============================================================

scroll_threshold=0.80
scrollbar_width=5
scrollbar_gap=0
scrollbar_right_gap=1
scrollbar_min_thumb=20

scrollbar_track=#48484A
scrollbar_thumb=#8E8E93
scrollbar_track_alpha=70
scrollbar_thumb_alpha=145
scroll_step=1
