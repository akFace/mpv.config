# ============================================================
# Menu bindings for mpv (English version)
# ============================================================

Ctrl+o  script-message-to menu open               #menu: Open > File...
Ctrl+O  script-message-to menu open-folder        #menu: Open > Folder...
_           script-message-to dialog open append  #menu: Open > Append to Playlist...
_           ignore                                #menu: Open > -
_           script-message-to dialog open bd-iso  #menu: Open > Blu-ray ISO...
_           script-message-to dialog open dvd-iso #menu: Open > DVD ISO...
_           ignore                                #menu: Open > -
Ctrl+v  script-message-to menu open-clipboard     #menu: Open > Clipboard
_           ignore                                #menu: Open > -
Ctrl+R      script-binding recentmenu/open        #menu: Open > Recent Files #@recent


Space       cycle pause                           #menu: Playback > Play/Pause #@state=(idle_active and 'disabled' or (pause or 'hidden'))
Ctrl+s      stop                                  #menu: Playback > Stop #@state=(idle_active and 'disabled')

_           ignore                                #menu: Navigation > Chapters #@chapters
F12         playlist-next                         #menu: Navigation > Next File
F11         playlist-prev                         #menu: Navigation > Previous File
_           ignore                                #menu: Navigation > -
PGUP        add chapter  1                        #menu: Navigation > Next Chapter
PGDWN       add chapter -1                        #menu: Navigation > Previous Chapter
_           ignore                                #menu: Navigation > -
.           frame-step                            #menu: Navigation > Next Frame
,           frame-back-step                       #menu: Navigation > Previous Frame
_           ignore                                #menu: Navigation > -
Right       seek  5                               #menu: Navigation > Forward 5 sec
Left        seek -5                               #menu: Navigation > Backward 5 sec
_           ignore                                #menu: Navigation > -
Up          seek  30                              #menu: Navigation > Forward 30 sec
Down        seek -30                              #menu: Navigation > Backward 30 sec
_           ignore                                #menu: Navigation > -
Ctrl+Right  seek  300                             #menu: Navigation > Forward 5 min
Ctrl+Left   seek -300                             #menu: Navigation > Backward 5 min

               
_           ignore                                #menu: Tracks #@tracks
_           ignore                                #menu: Editions #@editions
_           ignore                                #menu: Playlist #@playlist

[           multiply speed 1/1.1                  #menu: Video > Speed > -10%
]           multiply speed 1.1                    #menu: Video > Speed > +10%
_           ignore                                #menu: Video > Speed > -
{           multiply speed 0.5                    #menu: Video > Speed > Halve
}           multiply speed 2.0                    #menu: Video > Speed > Double
_           ignore                                #menu: Video > Speed > -
_           set speed 0.5                         #menu: Video > Speed > 0.5x
_           set speed 0.75                        #menu: Video > Speed > 0.75x
_           set speed 1.0                         #menu: Video > Speed > 1.0x
_           set speed 1.25                        #menu: Video > Speed > 1.25x
_           set speed 1.5                         #menu: Video > Speed > 1.5x
_           set speed 2.0                         #menu: Video > Speed > 2.0x
_           ignore                                #menu: Video > Speed > -
BS          set speed 1                           #menu: Video > Speed > Reset
KP8         cycle video                           #menu: Video > Switch Track #@tracks/video
_           script-message-to dialog open add-video #menu: Video > Load File... #@state=(idle_active and 'disabled')
_           ignore                                #menu: Video > -
Ctrl+1      add contrast -1                       #menu: Video > Color > Contrast -1
Ctrl+2      add contrast  1                       #menu: Video > Color > Contrast +1
_           ignore                                #menu: Video > Color > -
Ctrl+3      add brightness -1                     #menu: Video > Color > Brightness -1
Ctrl+4      add brightness  1                     #menu: Video > Color > Brightness +1
_           ignore                                #menu: Video > Color > -
Ctrl+5      add gamma -1                          #menu: Video > Color > Gamma -1
Ctrl+6      add gamma  1                          #menu: Video > Color > Gamma +1
_           ignore                                #menu: Video > Color > -
Ctrl+7      add saturation -1                     #menu: Video > Color > Saturation -1
Ctrl+8      add saturation  1                     #menu: Video > Color > Saturation +1
_           ignore                                #menu: Video > Color > -
Ctrl+9      add hue -1                            #menu: Video > Color > Hue -1
Ctrl+0      add hue  1                            #menu: Video > Color > Hue +1
_           ignore                                #menu: Video > Color > -
_           set contrast 0; set brightness 0; set gamma 0; set saturation 0; set hue 0 #menu: Video > Color > Reset
Ctrl+I      cycle icc-profile-auto                #menu: Video > Auto ICC Profile #@state=(icc_profile_auto and 'checked')
_           ignore                                #menu: Video > -
Ctrl+r      cycle-values video-rotate 90 180 270 0 #menu: Video > Rotate
Ctrl+-      add video-zoom -0.1                   #menu: Video > Zoom > Zoom Out -1%
Ctrl+=      add video-zoom  0.1                   #menu: Video > Zoom > Zoom In +%
Ctrl+KP4    add video-pan-x -0.01                 #menu: Video > Pan > Pan Left
Ctrl+KP6    add video-pan-x  0.01                 #menu: Video > Pan > Pan Right
_           ignore                                #menu: Video > Pan > -
Ctrl+KP8    add video-pan-y -0.01                 #menu: Video > Pan > Pan Up
Ctrl+KP2    add video-pan-y  0.01                 #menu: Video > Pan > Pan Down
Ctrl+BS     set video-zoom 0; set video-pan-x 0; set video-pan-y 0 #menu: Video > Pan > Reset
a cycle-values video-aspect-override 16:9 4:3 2.35:1 0 -1    #menu: Video > Aspect > Toggle
_           set video-aspect-override 16:9        #menu: Video > Aspect > 16:9
_           set video-aspect-override 4:3         #menu: Video > Aspect > 4:3
_           set video-aspect-override 2.35:1      #menu: Video > Aspect > 2.35:1
_           set video-aspect-override -1          #menu: Video > Aspect > Auto
_           ignore                                #menu: Video > -
w           add panscan -0.1                      #menu: Video > Crop > -
W           add panscan  0.1                      #menu: Video > Crop > +
_           ignore                                #menu: Video > -
D           cycle deband                          #menu: Video > Deband #@state=(deband and 'checked')
d           cycle deinterlace                     #menu: Video > Deinterlace #@state=(deinterlace and 'checked')
_           ignore                                #menu: Video > -
s           async screenshot                      #menu: Video > Screenshot #@state=(tonumber(vid) or 'disabled')
S           async screenshot video                #menu: Video > Screenshot (no subtitles) #@state=(tonumber(vid) or 'disabled')

# =====Shader Shortcuts for Anime4K=======
# Optimized shaders for higher-end GPU
Alt+kp_dec no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared" 
Alt+kp_del no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"
Alt+Del no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"      #menu: Video Enhance > Anime4K > Disable
Alt+F1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"  #menu: Video Enhance > Anime4K > Mode A (HQ)
